# Lightweight public-demo stack for a small VPS (e.g. <vps-provider> 6 vCPU / 12 GB / no GPU).
#   docker compose -f docker/docker-compose.demo.yml up --build -d
#
# Philosophy: the SPA does the heavy compute in the browser (WASM PQC, ONNX inference);
# the server only serves static assets + lightweight crypto-demo endpoints. No GPU,
# no torch, no Prometheus on the box (ship metrics to Grafana Cloud if desired).
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api.demo   # slim: core+api only (no FHE/torch, ~630 MB smaller)
    expose: ["8000"]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 2g, cpus: "2" } } }

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        CLIENT_ONLY: "1"        # public demo: all compute client-side (inference-only)
    depends_on: [api]
    # Override with WEB_HTTP_PORT / WEB_HTTPS_PORT if 80/443 are taken on the host.
    ports: ["${WEB_HTTP_PORT:-80}:80", "${WEB_HTTPS_PORT:-443}:443"]
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    deploy: { resources: { limits: { memory: 256m, cpus: "0.5" } } }

volumes:
  caddy_data:
  caddy_config:
