# Local full stack: API (optionally GPU) + SPA (Caddy) + Prometheus + Grafana.
#   docker compose -f docker/docker-compose.yml up --build
# For GPU, uncomment the `deploy.resources` block on `api` and install nvidia-container-toolkit.
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    # Override API_PORT if 8000 is taken on the host (the SPA reaches the API via the
    # internal docker network regardless of this host mapping). Loopback only (Round 86): published on
    # every interface, the API was reachable from the whole network, unauthenticated.
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes:
      - ../results:/app/results
    # GPU (Blackwell/CUDA13):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on: [api]
    ports: ["${WEB_PORT:-8080}:80"]

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml",
              "--storage.tsdb.retention.time=7d"]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    deploy: { resources: { limits: { memory: 512m } } }

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      # Provider YAML goes in provisioning/; the dashboard JSON goes where the provider points.
      # Mounting the JSON directory straight onto provisioning/dashboards silently loaded nothing.
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
    deploy: { resources: { limits: { memory: 256m } } }

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    ports: ["${NODE_EXPORTER_PORT:-9100}:9100"]
    deploy: { resources: { limits: { memory: 64m } } }
