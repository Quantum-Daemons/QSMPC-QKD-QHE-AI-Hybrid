name: dependency advisories

# Round 67. npm audit reported 0 at the end of Round 65, development tooling included, and the Rust
# crates compiled into the MPC wasm had never been audited. Nothing kept either true: an advisory
# published tomorrow against a package already locked changes nothing in this repository, so no
# push-triggered workflow would see it. This one runs daily, on demand, and whenever a manifest, a
# lockfile, the cargo-deny policy or this check changes. Both jobs run scripts/audit_deps.sh, the
# script a developer runs locally, so the two cannot drift apart.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "web/package.json"
      - "web/package-lock.json"
      - "docker/mcp-fs/package-lock.json"
      - "requirements.lock"
      - "wasm/qsh-mpc/Cargo.toml"
      - "wasm/qsh-mpc/Cargo.lock"
      - "wasm/qsh-mpc/deny.toml"
      - "scripts/audit_deps.sh"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "web/package.json"
      - "web/package-lock.json"
      - "docker/mcp-fs/package-lock.json"
      - "requirements.lock"
      - "wasm/qsh-mpc/Cargo.toml"
      - "wasm/qsh-mpc/Cargo.lock"
      - "wasm/qsh-mpc/deny.toml"
      - "scripts/audit_deps.sh"
      - ".github/workflows/audit.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    name: npm audit (development tooling included)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fail on any advisory against web/package-lock.json
        run: bash scripts/audit_deps.sh npm

  python:
    # Round 86. Nothing audited the Python tier: CI and the image installed whatever the floors resolved to that day.
    name: pip-audit (requirements.lock)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail on any advisory against requirements.lock
        run: bash scripts/audit_deps.sh python

  seal:
    # Round 86. No advisory names Microsoft SEAL, so the job above passes while the browser's node-seal
    # 7.0.0 bundles SEAL 4.1.2, behind SEAL 4.4.0's critical security update. node-seal's move to SEAL
    # 4.7.2 is merged upstream and not yet on npm: this fails on the first day it is, so the upgrade the
    # threat model's residual risk waits for cannot slip by.
    name: node-seal is npm's newest (SEAL residual risk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fail once npm's newest node-seal is not the locked one
        run: bash scripts/audit_deps.sh seal

  polytune:
    # Round 86. The crate's pin is watched by a test, and nothing watched upstream: an answer on the issues the threat
    # model waits on, or a change to the protocol's source past the pin, would have passed unseen.
    name: Polytune upstream (protocol source, issues 63 and 100)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fail once the protocol source or either issue changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/audit_deps.sh polytune

  rust:
    name: cargo-deny (advisories, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # cargo-deny and its advisory database, kept between runs. The database is fetched fresh on every
      # run regardless; the cache only saves compiling cargo-deny.
      - uses: actions/cache@v4
        with:
          path: wasm/qsh-mpc/.cargo-home
          key: audit-cargo-${{ hashFiles('wasm/qsh-mpc/Cargo.lock', 'scripts/audit_deps.sh') }}
          restore-keys: audit-cargo-
      - name: Fail on any advisory or unexpected source in wasm/qsh-mpc/Cargo.lock
        run: CARGO_JOBS=4 bash scripts/audit_deps.sh rust
