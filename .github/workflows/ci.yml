name: CI

# Every guarantee in this project's review protocol was previously enforced by hand, once per round,
# by a person remembering to run it. This workflow makes the ones that can be machine-checked
# actually machine-checked: config parity, no Japanese in public files, no secrets staged, the test
# suite, and the web typecheck/build.
#
# Deliberately offline: no test may reach the network, so CI stays reproducible and a dataset host
# being down cannot turn into a red build.

on:
  push:
    branches: ["main", "round*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false        # nothing in the test path builds against a submodule

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install core + API + FHE + AI tiers
        run: |
          # The libsodium pysodium loads for the OPRF PSI (qsh.qsmpc.oprf). QSH_REQUIRE_LIBSODIUM below
          # turns its absence into a failure, so the pure-Python fallback cannot pass for it.
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libsodium23
          python -m pip install --upgrade pip
          # The lock, with its hashes (scripts/lock_requirements.sh): what this job tests is what the image installs.
          # The AI tier IS required. An earlier revision of this workflow skipped it on the
          # assumption that only slow tests needed torch; that was wrong — test_usecases.py and
          # test_unified_benchmark.py import torch and xgboost through the use-case modules and
          # fail at collection without them. Skipping the tier would have meant CI silently not
          # covering the ML paths, which is the exact kind of false confidence this project avoids.
          # CPU wheels only: no GPU on the runner, and the CUDA build is an order of magnitude larger.
          pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          pip install --no-deps -e .

      # Needed by the cross-language gates: they bundle `web/src/lib/*.ts` with esbuild and run it
      # under node to compare the browser's numbers against Python's. Without this the gates skip.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies (for the cross-language gates)
        working-directory: web
        # onnxruntime-node (pulled in by @huggingface/transformers, never imported here) fetches CUDA
        # binaries from api.nuget.org in its install script. That download timed out twice on one
        # commit in Round 75 and failed both a Python and a web job. Nothing here runs CUDA; the
        # package documents this switch, and its CPU binaries are bundled.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      - name: Test suite
        # Offline by design: no test may reach the network. Where a dataset is unavailable the
        # loader falls back to synthetic data and logs that loudly (see qsh/data/loaders.py) — a
        # labelled fallback, never a silent substitution.
        #
        # `-m "not slow"` DESELECTS tests/test_round2.py::test_openfhe_bootstrap. Measured:
        # "10/11 tests collected (1 deselected)" for that file. So this step says nothing
        # whatsoever about OpenFHE bootstrapping — that is the next step's job, and it is a
        # separate step precisely so a green tick here is never mistaken for FHE coverage.
        env:
          HF_HUB_OFFLINE: "1"
          # THE CROSS-LANGUAGE GATES WERE SKIPPING HERE, SILENTLY. Several tests execute the
          # browser's own model through esbuild + node and compare its numbers against Python -
          # they are the only checks that can see a change reaching one language and not the other,
          # which is this project's most-repeated defect. They guard on
          # `if not ESBUILD.exists(): pytest.skip(...)`, `web/node_modules` is gitignored, and this
          # job installed no Node - so on a fresh checkout they reported SKIP and the run went
          # green. MEASURED on a clone of the tip with no `web/node_modules`: 21 collected,
          # 11 passed, **10 skipped** - 6 in tests/test_the_browser_computes_the_bound_the_page_
          # names.py and 4 in tests/test_the_qcnn_agrees_across_languages.py. An earlier revision
          # of this comment said 20 / 11 / 9, which was the count one commit earlier: the commit
          # that wrote the comment added a 21st gate, and it skips too.
          #
          # Proven consequence: seeding the pre-Round-47 shared-scalar fully-connected block into
          # `quantumSim.ts` - replacing the per-survivor `fcAt` pair with
          # `for (const q of active) RY(q, w.theta[nConv + stages]);` - fails FOUR of these gates
          # when esbuild is present, at maximum readout differences 0.399170 (telecom-q7), 0.331032
          # (telecom), 0.016233 (medical) and 0.008699 (finance), and passes the entire workflow
          # when it is not. The single "0.585" an earlier revision quoted was measured on the
          # PRE-RETRAIN weights of f5861c9, where the same seeding gives 0.585404 on telecom; the
          # commit that published the figure retrained all six artifacts, so it was stale on
          # arrival. The local runner
          # (`scripts/ci_local.sh`) was strictly STRONGER than CI, which is the reverse of what a
          # CI gate is for.
          #
          # With this set, the skip becomes a failure instead. The Node install below is what makes
          # that satisfiable.
          QSH_REQUIRE_BROWSER_GATES: "1"
          QSH_REQUIRE_LIBSODIUM: "1"
        run: pytest -m "not slow" -q

      - name: OpenFHE CKKS bootstrapping (the slow test the suite above deselects)
        # For most of this project's life "CI is green" implied nothing about bootstrapping: the
        # only test for it was marked slow, so CI never collected it, while on the EL9 dev host
        # it segfaulted the interpreter. Two green signals, zero coverage. This step closes that
        # gap by running that one test on purpose.
        #
        # QSH_REQUIRE_OPENFHE_BOOTSTRAP=1 removes the last escape hatch: on a host where openfhe
        # cannot be imported the test would normally skip, and here that is a failure instead.
        # The runner is ubuntu-24.04 and requirements-fhe.txt pins openfhe>=1.6.1,<1.7, whose wheel is
        # built for exactly that distro — so an ImportError here means the dependency broke, not
        # that the platform is unsupported.
        env:
          HF_HUB_OFFLINE: "1"
          QSH_REQUIRE_OPENFHE_BOOTSTRAP: "1"
        run: pytest tests/test_round2.py::test_openfhe_bootstrap -m slow -q

      - name: Config parity (defaults.py -> config.defaults.json)
        # The committed JSON is what the zero-backend demo reads. If it drifts from the Python
        # dataclasses, the demo silently shows different numbers than the API does.
        run: |
          python scripts/export_config.py
          git diff --exit-code -- web/src/lib/config.defaults.json \
            || { echo "::error::config.defaults.json is stale — run: python scripts/export_config.py"; exit 1; }

      - name: Combiner vectors are regenerated
        # The vectors are generated FROM the Python combiners, so a Python change that is not
        # regenerated leaves the two languages apart while the browser-side parity gate stays green
        # against stale bytes. Same mechanism as the config-parity step above, and it must run in
        # THIS job: it needs oqs and the rest of the crypto tier, which the web job does not install.
        run: |
          python scripts/export_combiner_vectors.py
          git diff --exit-code -- web/scripts/vectors/hybrid_combiner_vectors.json \
            || { echo "::error::hybrid_combiner_vectors.json is stale - run: python scripts/export_combiner_vectors.py"; exit 1; }
          python scripts/export_mcp_vectors.py
          git diff --exit-code -- web/scripts/vectors/mcp_envelope_vectors.json \
            || { echo "::error::mcp_envelope_vectors.json is stale - run: python scripts/export_mcp_vectors.py"; exit 1; }

      - name: Generated artifacts match their generator and their history
        # The step above compares the two DERIVED artifacts to each other, so it is blind by
        # construction to the case where both agree and neither matches the trainer that writes them.
        # That happened: Round 32 corrected an overclaiming `baseline_gap_note` by hand in
        # models/metrics.json and web/src/lib/config.defaults.json and left the generator emitting the
        # original, so the next retrain would have reverted the correction and publish_hf.py would have
        # pushed the reverted sentence to a public model card. This reads each trainer's string literal
        # out of the AST - no model runs - and diffs it against the recorded value.
        run: python scripts/check_generated_prose.py

      - name: The Python walkthrough's record and its notebook
        run: |
          python scripts/build_walkthrough.py --check
          python -m venv /tmp/walkthrough
          /tmp/walkthrough/bin/pip install --quiet --require-hashes -r walkthroughs/requirements.lock
          /tmp/walkthrough/bin/python walkthroughs/nidd_copies.py

      - name: Lint (blocking, Round-17 modules)
        # The repository carries 51 pre-existing ruff findings that predate this workflow. Turning
        # them into a red build on day one would mean the first thing anyone learns about CI is to
        # ignore it. So the gate is blocking for the code added in Round 17 and advisory for the
        # rest, and the advisory count is printed so it can be driven down deliberately rather than
        # discovered by accident.
        run: |
          pip install ruff
          ruff check src/qsh/models scripts/train scripts/publish_hf.py scripts/data
          # Undefined names over every Python file: a NameError waiting on a path no test runs.
          ruff check --select F821 src tests api scripts

      - name: Lint (advisory, whole tree)
        continue-on-error: true
        run: ruff check src tests api scripts --output-format=concise

  guards:
    name: repository guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: No local-only files tracked
        # Local-only files are git-ignored by design; a `git add -f` would defeat that silently.
        run: make check-secrets

      - name: No Japanese in public files
        # Public-facing source and docs are English-only. Scope is the git INDEX rather than a
        # directory list, so "public" means "tracked". Three things follow: a git-ignored file
        # is excluded by construction rather than by an exception, the repo ROOT
        # is covered, and a new directory or file type is covered without editing this step. The scope
        # was a six-extension list until Round 34, which left 122 of 356 tracked files unscanned -
        # including 59 .json, 7 .txt and 5 .tex - while the comment claimed it meant "exactly tracked".
        run: |
          if git ls-files -sz | awk -v RS='\0' -v ORS='\0' '$1 != "160000" { sub(/^[^\t]*\t/, ""); print }' \
               | xargs -0 -r grep -IlP '[\x{3040}-\x{309F}\x{30A0}-\x{30FF}\x{4E00}-\x{9FFF}]'; then
            echo "::error::Japanese characters found in public files (listed above)"
            exit 1
          fi
          echo "clean"

      - name: No model artifacts committed
        # Weights live on the Hugging Face Hub at a pinned revision, never in git.
        run: |
          # .npy included: fixtures.npy holds dataset-derived feature rows, so it carries the
          # training data's licence and must not be redistributed either.
          if git ls-files | grep -E '\.(onnx|safetensors|pt|pth|h5|npy)$'; then
            echo "::error::model artifacts must not be committed; publish them to the Hub instead"
            exit 1
          fi
          echo "clean"

  sbom:
    name: SBOMs and the CBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The threshold-aggregation module's SBOM lists the Go modules `go list` compiles into it (Round 86).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: false

      - name: Install the generators
        run: |
          python -m pip install --quiet "cyclonedx-bom==9.0.0" "jsonschema==4.26.0"
          cargo install cargo-cyclonedx --version 0.5.10 --locked

      - name: Generate the SBOMs
        run: bash scripts/generate_sbom.sh sbom-out

      - name: Validate them and the CBOM against the vendored CycloneDX 1.7 schema
        run: python scripts/validate_cyclonedx.py sbom-out/python.cdx.json sbom-out/web.cdx.json sbom-out/wasm.cdx.json sbom-out/fedthresh.cdx.json web/public/cbom/qsh.cdx.json

      # Three tools the owner chose on 2026-11-23, each pinned and checked against the SHA-256 GitHub records for its
      # release asset, and run offline. sbom-utility v1.0.1 checks the CBOM against this repository's own rules and fails
      # the job on a broken one; sbom-tools 0.4.0 reads the CBOM against NIST IR 8547, and scripts/compare_sbom_tools.py
      # fails the job on a difference from the Validations page's reading that has no review note; sbomqs 2.1.3 scores the
      # four SBOMs and never fails it. Nothing any of them says is shown on the site.
      - name: Install sbom-utility, sbom-tools and sbomqs
        run: |
          d="$RUNNER_TEMP/sbomtools" && mkdir -p "$d/su" "$d/st" "$d/sq" && cd "$d"
          curl -sSfL -o su.tgz https://github.com/CycloneDX/sbom-utility/releases/download/v1.0.1/sbom-utility-v1.0.1-linux-amd64.tar.gz
          curl -sSfL -o st.tgz https://github.com/sbom-tool/sbom-tools/releases/download/v0.4.0/sbom-tools-linux-x86_64.tar.gz
          curl -sSfL -o sq.tgz https://github.com/interlynk-io/sbomqs/releases/download/v2.1.3/sbomqs_2.1.3_Linux_x86_64.tar.gz
          printf '%s\n' \
            "05e62a9b79929203451c25b0ad11cdb3dc3c827cfee024297d1dc12fa25c53a6  su.tgz" \
            "94e2447f7048059b26f23dbbca87537f3711ddf2871abf668c27829b6f3b86f8  st.tgz" \
            "c96f07a6a27314c1c268af141af04f1c1b49e61400d7058f6419ca4f7f3bdd6b  sq.tgz" | sha256sum -c -
          tar -xzf su.tgz -C su && tar -xzf st.tgz -C st && tar -xzf sq.tgz -C sq
          printf '%s\n' "$d/su" "$d/st" "$d/sq" >> "$GITHUB_PATH"

      - name: The CBOM against this repository's rules (sbom-utility)
        run: sbom-utility validate -i web/public/cbom/qsh.cdx.json --custom schemas/sbom-utility/qsh-cbom-rules.json --quiet

      - name: The CBOM read against NIST IR 8547 (sbom-tools), beside the Validations page's reading
        run: |
          today=$(date -u +%Y-%m-%d)
          set +e
          sbom-tools validate web/public/cbom/qsh.cdx.json --standard pqc --pqc-mode deadline --as-of "$today" --offline -o json -O sbom-out/sbom-tools-pqc.json
          code=$?
          set -e
          # 0 compliant, 1 findings (this CBOM has some by design); anything else is the tool failing to run.
          [ "$code" -le 1 ] || { echo "sbom-tools did not run (exit $code)"; exit 1; }
          python scripts/compare_sbom_tools.py sbom-out/sbom-tools-pqc.json --write sbom-out/sbom-tools-comparison.json | tee -a "$GITHUB_STEP_SUMMARY"
          sbom-tools view web/public/cbom/qsh.cdx.json --bom-type cbom --as-of "$today" --offline -o markdown -O sbom-out/sbom-tools-cbom-view.md \
            || echo "sbom-tools view did not run" >> "$GITHUB_STEP_SUMMARY"

      - name: Score the four SBOMs (sbomqs, report only)
        env:
          INTERLYNK_DISABLE_VERSION_CHECK: "true"
        run: |
          for f in python web wasm fedthresh; do
            if sbomqs score "sbom-out/$f.cdx.json" --json > "sbom-out/sbomqs-$f.json"; then
              python -c "import json,sys; x=json.load(open(sys.argv[1]))['files'][0]; print(f\"- {sys.argv[2]}: sbomqs {x['sbom_quality_score']:.2f} ({x['grade']}), {x['num_components']} components\")" "sbom-out/sbomqs-$f.json" "$f.cdx.json" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $f.cdx.json: sbomqs could not score it" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-out/*.cdx.json
            sbom-out/sbom-tools-*.json
            sbom-out/sbom-tools-cbom-view.md
            sbom-out/sbomqs-*.json
          retention-days: 90

  # cdxgen 13.8.0's view of web/, report only (the owner's choice of 2026-11-23): the standalone binary, checked against
  # the SHA-256 GitHub records, run on a copy of web/ with licence fetching off and no dependency install. What it finds
  # is listed beside the CBOM's assets in the job summary; the job never fails the build. 13.9.0 when it is released.
  cdxgen:
    name: cdxgen's view of web/ (report only)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # The summary script below uses only the standard library.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cdxgen 13.8.0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cdxgen" https://github.com/cdxgen/cdxgen/releases/download/v13.8.0/cdxgen-linux-amd64
          echo "01f2a7f822449242987942ae81da7464dc9d8eed27ae36d33b0f4ddce95e5b43  $RUNNER_TEMP/cdxgen" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cdxgen"

      - name: Read a copy of web/
        env:
          CDXGEN_SECURE_MODE: "true"
        run: |
          cp -r web "$RUNNER_TEMP/web-copy"
          cd "$RUNNER_TEMP/web-copy"
          "$RUNNER_TEMP/cdxgen" -t js --include-crypto --evidence --spec-version 1.7 --no-install-deps --no-include-formulation \
            -o "$RUNNER_TEMP/cdxgen-web.cdx.json" . || echo "cdxgen exited $?" >> "$GITHUB_STEP_SUMMARY"

      - name: Its cryptographic assets beside the CBOM's
        run: python3 scripts/compare_cdxgen_crypto.py "$RUNNER_TEMP/cdxgen-web.cdx.json" web/public/cbom/qsh.cdx.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdxgen
          path: ${{ runner.temp }}/cdxgen-web.cdx.json
          if-no-files-found: warn
          retention-days: 30

  osv:
    name: known vulnerabilities in the lockfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # OSV-Scanner v2.7.1, checked against the release's own SHA256SUMS, then every tracked lockfile against the OSV
      # databases downloaded fresh (Round 86, the owner's choice of 2026-11-23). Exceptions: osv-scanner.toml.
      - name: Install OSV-Scanner
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: Scan every tracked lockfile
        run: bash scripts/scan_lockfiles.sh ./osv-scanner --download-offline-databases

  web:
    name: web typecheck + build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Round 65: the MPC tier is a wasm module built from wasm/qsh-mpc. This runs the SAME Rust stage of
      # docker/Dockerfile.web the demo image runs - including its `cargo test` and the third-party
      # notices - so CI type-checks and builds against the module that ships. Four jobs here; the
      # shared demo host builds with two.
      - name: Build the MPC and threshold-aggregation wasm (the web image's Rust and Go stages, their tests included)
        run: CARGO_JOBS=4 bash scripts/build_wasm.sh

      - name: Install
        working-directory: web
        env:
          ONNXRUNTIME_NODE_INSTALL: skip   # see the Python job's install step
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      # A line break in JSX text is dropped where it meets a value or an inline element, so wrapped
      # prose renders glued: the calibration caption read "at predicted 0.644against observed" on the
      # deployed page, with tsc and the build green. Round 74. Parsed with the TypeScript compiler,
      # so `{" "}` and a space kept inside the next node are both recognised.
      - name: JSX text keeps its spaces at line breaks
        working-directory: web
        run: npm run check:jsx-spaces

      - name: Build
        working-directory: web
        run: npm run build

      # A copied asset kept `//# sourceMappingURL=gif.worker.js.map` with no map beside it, so the
      # build named a file it does not ship. Round 74. Reads the build output, not the config that is
      # meant to prevent it.
      - name: No built file names a source map the build does not ship
        working-directory: web
        run: npm run check:source-maps

      # MIT, ISC, BSD and Apache-2.0 ask that their notice travel with the code, and minification keeps only React's,
      # Three.js's and ONNX Runtime's. vite.config.ts writes licenses/js-bundle.txt from the modules the bundle
      # contains; this reads the built file. Round 86.
      - name: The bundle's npm packages each carry their notice
        working-directory: web
        run: npm run check:js-notices

      # FIPS 203 section 7.2 negative vectors (2,595 malformed encapsulation keys) plus FIPS 204
      # sizes and a sign/verify round trip. Reads the vendored CC0 snapshot in web/scripts/vectors,
      # so it needs no network -- which is the only reason it can gate. It was defined in
      # package.json but wired into NO gate for several rounds precisely because it used to fetch.
      #
      # If this ever goes red, do not add a network or skip fallback. This check exists to catch a
      # library that silently accepts malformed keys: @noble/post-quantum 0.2.1 accepted all 2,595,
      # and a version of this script that skipped on error would have called that build clean.
      - name: PQC conformance
        working-directory: web
        run: npm run check:pqc

      # Separate step from the build for the same reason PQC conformance is: a green typecheck says
      # nothing about whether config reaches the QKD model. It did not - `error_correction_eff` had
      # no reader in `web/src` at all, and the browser ran on a literal that happened to match. The
      # check mutates the live config and requires the output to follow by the predicted ratio,
      # because a before/after diff is passed perfectly by a reader that reads nothing.
      - name: QKD model plumbing and identities
        working-directory: web
        run: npm run check:qkd

      # Third for the same reason again, and the sharpest case yet: the diagram claimed "pairwise
      # masking (demo keys)" and the DAG claimed "(secure aggregation)" while clientQFL summed
      # plaintext updates, with `secureAgg: true` written as a literal on the return line. tsc, the
      # build and the whole Python suite stayed green throughout, because none of them can see a
      # figure asserting a property of code in another file. This asserts the property on the
      # function: the masks are applied, keyed by each pair's X25519 secret through HKDF and untouched
      # by the session key (Round 84; until then they came from it), fresh per round, and cancel to a
      # bit-identical weighted mean. Five seeded defects were each caught by the assertion written
      # for them before this was wired here.
      - name: Federated secure aggregation
        working-directory: web
        run: npm run check:qfl

      # The four hospitals' aggregation, five ways and a DP row (Round 86): the medical page's worker module with the real
      # node-seal and the real Lattigo wasm built above. The masks row is the page's federation, threshold BGV equals it
      # to the bit, every CKKS design stays within its bound of the exact FedAvg, the DP row's every step under BGV equals
      # the masks' sum of the same noisy vectors, and the genomics page's threshold sum equals the plain one.
      - name: The four hospitals' aggregation, five ways and a DP row
        working-directory: web
        run: npm run check:fed-agg

      # The medical CNN student under MPC: a held-out image through CKKS and the garbled circuits, against the clear network. The
      # same circuit and masks the page runs, and the only check that sees the two halves and the shares between them together.
      - name: The CNN student under MPC
        working-directory: web
        run: npm run check:hybrid-cnn

      # The finance page's published MLPs under MPC: the module the page runs, against the logits the trainer recorded.
      - name: The finance MLPs under MPC
        working-directory: web
        run: npm run check:hybrid-mlp

      # The compact GNN under MPC: the module the page runs, against the logits the trainer recorded.
      - name: The compact GNN under MPC
        working-directory: web
        run: npm run check:hybrid-gnn

      # What IBM's Multi-GNN read for each scored transfer: the IBM tab's counts against a hand-counted graph.
      - name: The IBM tab's neighbourhood counts
        working-directory: web
        run: npm run check:graph-neighbourhood

      # IBM's Multi-PNA+EU against the two students distilled from it, on the 16 rows all three are checked on.
      - name: The IBM tab's teacher-student view
        working-directory: web
        run: npm run check:teacher-student

      # The trained QCNN with its input under CKKS: the module the page runs, against the circuit in the clear.
      - name: The trained QCNN under CKKS
        working-directory: web
        run: npm run check:qcnn-ckks

      # The trained QCNN re-scored on the rows of its trainer's test split: the module the page runs, against every recorded figure.
      - name: The trained QCNN re-scored on its held-out rows
        working-directory: web
        run: npm run check:qcnn-rescore

      # The finance page's PSI among three to five banks: the module the page runs, against the intersection in the clear.
      - name: The PSI among banks under MPC
        working-directory: web
        run: npm run check:multi-psi

      # The lending page: its model against closed forms and its own books, then the private check against the same check in the clear.
      - name: The lending model and its private check
        working-directory: web
        run: |
          npm run check:lending
          npm run check:lending-private

      # Backend and browser derived DIFFERENT session keys for two rounds, because the output-length
      # tag was added to the Python combiner alone and no browser test touched the combiner at all.
      # Three shipped strings asserted they matched, one of them rendered in the Validations panel.
      # This reproduces committed Python vectors through the real browser module - not a
      # re-implementation, which would have agreed with itself while the browser drifted.
      - name: Hybrid-KEM combiner parity
        working-directory: web
        run: npm run check:combiner

      # The MCP request text against Python's committed vectors, and the AI-generated record: signed by
      # the production module, read back, each edit refused. The Python job reads the same sample file.
      - name: MCP request parity and the AI-generated record
        working-directory: web
        run: npm run check:mcp-envelope

      # Structural check on a RELATION between two branches, which no type checker can see. The QCNN
      # latency metrics were added to the private_inference call site and not to the qml_ids one, so
      # telecom reported `primary_inference_backend = qcnn-trained` with no cost beside it while two
      # checklist rows asserted the cost renders on every such page. tsc, the test suite and every
      # gate above were green; the deployed telecom page said "inference not run".
      #
      # Fourth instance here of shipping one fix to one of two twins - the combiner length tag, the
      # ITS combiner PRG, the federated mask round index, and this.
      - name: QCNN cost metrics at every site claiming the backend
        working-directory: web
        run: npm run check:qcnn-metrics

      # The reliability chart binned the raw output as P(positive), and the three medical models
      # emit logits: every medical page drew a calibration chart of logits reporting "predicted
      # -5.471", while tsc, the build and the argmax verdict stayed green. Round 74. Asserts the
      # conversion, that the binning refuses a non-probability, and that both readers of a graph
      # take its meaning from the output's name.
      - name: A model's output becomes a probability before it is binned as one
        working-directory: web
        run: npm run check:calibration

      # Text over text, out of the box it labels, into a dot or against a border, or clipped by its
      # chart, and HTML wider than its box, on every page after each page's run. Round 80: the user
      # found labels overflowing the run diagrams, and the first scan found more on the pages. The
      # page font is `system-ui`, which this runner resolves to DejaVu Sans, about a tenth wider than
      # the font the pages were drawn in: labels that fit locally did not fit in it. That is why this
      # runs here as well as in scripts/ci_local.sh, which scans in the local font. Google Chrome is
      # on the runner. Offline, as this workflow is: the page may reach localhost only, so the
      # published models' stage fails and the scan measures every page without their results.
      - name: Text layout, contrast, header cells and load shift on every page, in the runner's font
        working-directory: web
        run: |
          VITE_CLIENT_ONLY=1 npx vite build --outDir /tmp/qsh-scan >/tmp/qsh-scan-build.log 2>&1 \
            || { tail -20 /tmp/qsh-scan-build.log; exit 1; }
          npx vite preview --outDir /tmp/qsh-scan --port 4182 --strictPort >/tmp/qsh-preview.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://localhost:4182/ && break; sleep 1; done
          SCAN_OFFLINE=1 node scripts/check_text_overlap.mjs http://localhost:4182 1280 720

      # Every page under the site's Content-Security-Policy (Round 86, the owner's choices of 2026-11-20: an enforced
      # policy, and this check in CI as well as scripts/ci_local.sh step 8b). `vite preview` above sends none of Caddy's
      # headers, so the build just made, with the walkthrough the web image builds, is served by the Caddy image the web
      # image uses and its Caddyfile, and walked offline with every worker attached: any violation fails. The walkthrough
      # is on an origin of its own, as on the demo (QSH_WALKTHROUGH_ORIGIN): http://127.0.0.1:4183, reached through the
      # app's 301. Then a policy without 'wasm-unsafe-eval' must make the same check fail, or the check itself is not
      # seeing anything; that Caddy runs without the setting, and its /walkthrough/ must serve the walkthrough.
      - name: Every page under the site's Content-Security-Policy, and a broken policy fails
        working-directory: web
        run: |
          CADDY=$(grep -oE '^FROM caddy:[^ ]+' ../docker/Dockerfile.web | head -1 | cut -d' ' -f2)
          mkdir -p /tmp/qsh-csp && cp -r /tmp/qsh-scan /tmp/qsh-csp/srv
          docker build -q --target walkthrough -t qsh-ci-walkthrough -f ../docker/Dockerfile.web .. >/tmp/qsh-csp-walkthrough.log 2>&1 \
            || { tail -20 /tmp/qsh-csp-walkthrough.log; exit 1; }
          cid=$(docker create qsh-ci-walkthrough) && docker cp "$cid:/out" /tmp/qsh-csp/srv/walkthrough && docker rm "$cid" >/dev/null
          cp ../docker/env/Caddyfile.client-only /tmp/qsh-csp/Caddyfile
          sed "s/script-src 'self' 'wasm-unsafe-eval';/script-src 'self';/" /tmp/qsh-csp/Caddyfile > /tmp/qsh-csp/Caddyfile.broken
          cmp -s /tmp/qsh-csp/Caddyfile /tmp/qsh-csp/Caddyfile.broken && { echo "the seed changed nothing"; exit 1; }
          WALK=http://127.0.0.1:4183
          for c in good:4183:Caddyfile:$WALK broken:4184:Caddyfile.broken:; do
            IFS=: read -r tag port file walk <<< "$c"
            docker run -d --rm --name "qsh-csp-$tag" -p "127.0.0.1:$port:80" -e SITE_ADDRESS=:80 -e "QSH_WALKTHROUGH_ORIGIN=$walk" \
              -v /tmp/qsh-csp/srv:/srv:ro -v "/tmp/qsh-csp/$file:/etc/caddy/Caddyfile:ro" "$CADDY" >/dev/null
            for _ in $(seq 1 30); do curl -sf -o /dev/null "http://localhost:$port/" && break; sleep 1; done
          done
          CSP_OFFLINE=1 node scripts/check_csp.mjs http://localhost:4183
          moved=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:4183/walkthrough/)
          [ "$moved" = "301 $WALK/" ] || { echo "FAIL  the app's /walkthrough/ answered '$moved', not a 301 to $WALK/"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$WALK/usecase/medical_fl")" = 404 ] || { echo "FAIL  the walkthrough's origin answers an app page"; exit 1; }
          curl -s -D - -o /dev/null http://localhost:4184/walkthrough/ | tr -d '\r' | grep -qi "^content-security-policy: .*'unsafe-eval'" \
            || { echo "FAIL  without QSH_WALKTHROUGH_ORIGIN, /walkthrough/ did not serve the walkthrough under its policy"; exit 1; }
          echo "PASS  the walkthrough on its own origin, and at /walkthrough/ without the setting"
          rc=0
          CSP_OFFLINE=1 CDP_PORT=9357 CSP_PAGES=/usecase/medical_fl node scripts/check_csp.mjs http://localhost:4184 \
            > /tmp/qsh-csp-broken.log 2>&1 || rc=$?
          cat /tmp/qsh-csp-broken.log
          if [ "$rc" = 0 ]; then
            echo "FAIL  the check passed a policy without 'wasm-unsafe-eval': it would not see a broken policy"; exit 1
          fi
          # Failing for that reason: a Chrome that never started also exits 1.
          grep -A40 '^  FAIL /usecase/medical_fl' /tmp/qsh-csp-broken.log | grep -qi 'wasm' \
            || { echo "FAIL  the broken-policy run failed, but not on WebAssembly"; exit 1; }
          echo "PASS  the check fails the broken policy on WebAssembly, as it must"

      # The README's eleven Mermaid diagrams, rendered and measured: no label out of its node, over
      # another or crossed by an edge, and each fits GitHub's README column. A checklist row run by
      # hand until Round 80, when the owner chose a gate; Mermaid is a dev dependency for it alone.
      - name: README diagrams laid out
        working-directory: web
        run: npm run check:readme-mermaid

      # The "combiner vectors are regenerated" check is deliberately NOT in this job. It runs
      # `python`, this job installs only Node, and it failed with ModuleNotFoundError the first time
      # it ever executed - added in the same round as the parity gate above and never observed to
      # run. It now lives in the `python` job beside the config-parity check, which is the job that
      # has the dependencies. `scripts/ci_local.sh` could not have caught this: locally the venv is
      # always present, which is precisely the local-green/CI-red split that script's header exists
      # to warn about. A gate written and not watched run is a gate with an unknown result.
