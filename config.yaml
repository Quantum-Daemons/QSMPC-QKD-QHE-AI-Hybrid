# QSH configuration — overrides the dataclass defaults in src/qsh/config/defaults.py.
# Values shown are the defaults; edit to retune. The WebUI "Advanced parameters" panel
# sends per-run overrides that take precedence over this file at run time.
# Point at a different file with the QSH_CONFIG environment variable.

qkd:
  # Kept in step with `QKDConfig.pulses` in src/qsh/config/defaults.py, which carries the reasoning.
  # This line used to summarise that reasoning as "200000 gave 1,244 sifted bits, below the
  # ~5e3-1.1e4 finite-key positive-key band". Round 47 refuted the band on both counts: no such
  # threshold appears in the paper it was credited to, and src/qsh/qkd/finite_key.py, which
  # implements that paper's own equations, puts the positive-key threshold at ~1e5 sifted bits and
  # about 4e7 pulses at the intensities shipped until this round - an order of magnitude higher than
  # the band. At 2000000 pulses the single-photon lower bound is NEGATIVE, so Round 46's block
  # carried no composable key at any parameter setting. The value here follows the dataclass, which
  # is sized against the computed threshold rather than against a quoted band; the rate this project
  # publishes on the page remains the ASYMPTOTIC decoy bound, labelled as one everywhere it appears.
  #
  # This file SHADOWS the dataclass and the header above promises it shows the defaults, so a value
  # changed there and not here makes that promise false while every gate stays green. It did:
  # raising the dataclass moved nothing until this line changed too.
  pulses: 20000000
  distance_km: 50.0
  # The detector set is Rusca et al. 2018's since Round 76 (QKDConfig carries the sources). It was
  # 0.25 / 1.0e-5 / 0.015 here and in the dataclass; the 1 GHz clock and the 100 ns dead time that
  # came with it are dataclass defaults this file does not repeat.
  fiber_loss_db_per_km: 0.2
  detector_efficiency: 0.5
  dark_count_prob: 1.0e-8
  misalignment: 0.01
  eve_intercept_fraction: 0.0
  error_correction_eff: 1.16

qsmpc:
  # Omit `prime` to derive it from n_parties as Sutradhar's construction requires: d prime with
  # n <= d <= 2n. Pinning 4099 here satisfied "is prime" and "> n" and nothing else - it sits ~300x
  # outside the admissible field for n=7, and d**t then exceeds the statevector bound so every run
  # silently used the analytic sampler instead of the GHZ state the UI describes.
  # prime: 11
  n_parties: 7
  threshold: 3
  qot_n: 512
  qot_test_fraction: 0.25

qhe:
  n_qubits: 8
  sk_eps: 1.0e-3

fhe:
  backend: tenseal          # tenseal | openfhe   (commercial-OK; HEonGPU GPU via benchmark glue)
  # THIS file is what runs: load_config() overlays it onto the dataclass defaults, so editing
  # src/qsh/config/defaults.py alone changes nothing. Round 38 raised this to 16384, measured
  # the result and put it back - see FHEConfig for the numbers.
  poly_modulus_degree: 8192
  coeff_mod_bit_sizes: [60, 40, 40, 60]
  global_scale_bits: 40
  max_level: 12
  use_gpu: true
  use_bootstrap: false      # OpenFHE CKKS EvalBootstrap (deeper circuits)

federated:
  rounds: 8
  local_epochs: 1
  lr: 0.05
  batch_size: 32
  hospitals: 4
  test_split: 0.2
  secure_aggregation: true

train:
  epochs: 15
  batch: 64
  lr: 1.0e-3
  test_split: 0.2

ids:
  n_per_class: 300
  test_fraction: 0.25
  rf_estimators: 200
  q_n_qubits: 4
  q_n_layers: 2
  q_epochs: 25
  q_lr: 0.1

data:
  n_transactions: 4000
  fraud_rate: 0.05
  n_genotypes: 1000
  n_snps: 64

benchmark:
  n_samples: 30
  quantum_qubits: 8
  quantum_samples: 20

crypto:
  kem: ml-kem-768+x25519
  qkd: bb84-decoy
  fhe: tenseal-cpu
  sig: ml-dsa-65

orchestration:
  step_delay: 0.4           # seconds between stages so the SPA DAG animates visibly
