[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsh"
version = "0.1.0"
description = "Quantum-Safe Hybrid: E2E orchestration security layer combining QKD, QSMPC, QHE/FHE and privacy-preserving AI on a PQC-first hybrid foundation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "QSMPC-QKD-QHE-AI-Hybrid contributors" }]
keywords = [
    "post-quantum-cryptography", "QKD", "QSMPC", "homomorphic-encryption",
    "quantum-machine-learning", "federated-learning", "privacy-preserving-ai",
]

# Core runtime deps are kept minimal so the package imports without GPU/heavy stacks.
# Heavier tiers live in requirements-*.txt (ai, fhe, gpu, api) and extras below.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
quantum = ["qiskit>=1.2", "qiskit-aer>=0.15", "pennylane>=0.38"]
pqc = ["liboqs-python>=0.10", "cryptography>=42.0"]
ai = ["torch>=2.3", "onnx>=1.16", "onnxruntime>=1.18", "scikit-learn>=1.4", "xgboost>=2.0", "medmnist>=3.0", "flwr>=1.11"]
fhe = ["tenseal>=0.3.15"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "websockets>=12.0", "prometheus-client>=0.20", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
qsh = "qsh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
markers = ["slow: slower tests (quantum variational training, large sims)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
